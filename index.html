<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a3d6b">
<title>Clima | Arthur Dev Web</title>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; --card: rgba(255,255,255,.18); --dock: rgba(40,30,45,.72); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; font-family: var(--font); color: #fff;
    background: var(--sky, #2a3d6b) fixed; transition: background .8s ease;
    padding: env(safe-area-inset-top, 0) 0 0;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 70% 9% at 15% 14%, rgba(255,255,255,.14), transparent 70%),
      radial-gradient(ellipse 55% 8% at 85% 27%, rgba(255,215,235,.20), transparent 70%),
      radial-gradient(ellipse 80% 12% at 10% 52%, rgba(255,205,225,.18), transparent 70%);
  }
  body.clear-day    { --sky: linear-gradient(180deg,#2d7fd8 0%,#5ea5ec 45%,#a8d4f5 100%); --dock: rgba(20,50,90,.55); }
  body.clear-night  { --sky: linear-gradient(180deg,#0a1530 0%,#1b2f5e 50%,#3d4f82 100%); --card: rgba(90,110,180,.26); }
  body.clouds-day   { --sky: linear-gradient(180deg,#4f6f94 0%,#7d98b6 50%,#b3c4d6 100%); --dock: rgba(30,45,65,.6); }
  body.clouds-night { --sky: linear-gradient(180deg,#2a3d6b 0%,#4f66a3 38%,#8a86a8 68%,#c4a291 100%); --card: rgba(95,112,180,.32); --dock: rgba(60,35,28,.78); }
  body.rain-day     { --sky: linear-gradient(180deg,#38485a 0%,#62788e 50%,#93a6b6 100%); }
  body.rain-night   { --sky: linear-gradient(180deg,#10161e 0%,#26323f 55%,#46576a 100%); }
  body.storm        { --sky: linear-gradient(180deg,#1f2236 0%,#3c3f5d 55%,#5d607f 100%); }
  body.snow         { --sky: linear-gradient(180deg,#7088a0 0%,#a7b9ca 55%,#d5dfe8 100%); --dock: rgba(40,55,70,.6); }
  body.mist         { --sky: linear-gradient(180deg,#5f6d79 0%,#8e9ba6 55%,#b9c2ca 100%); }

  main { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 0 16px 130px; }
  svg { display: block; }

  /* Topo */
  .top { text-align: center; padding: 48px 0 26px; text-shadow: 0 1px 10px rgba(0,0,0,.12); }
  .loc { display: inline-flex; align-items: center; gap: 5px; font-size: .95rem; font-weight: 700; letter-spacing: .02em; }
  .city { font-size: 2.2rem; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
  .now { font-size: 1.35rem; font-weight: 600; margin-top: 4px; }
  .now .t { opacity: .75; } .now .bar-sep { margin: 0 8px; opacity: .8; }
  .now .c { text-transform: capitalize; }

  /* Cartões */
  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(30px) saturate(1.3); backdrop-filter: blur(30px) saturate(1.3);
    border-radius: 26px; padding: 16px 16px 14px; margin-bottom: 14px;
  }
  .card h2 { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; letter-spacing: .01em; color: rgba(255,255,255,.62); padding-bottom: 11px; border-bottom: 1px solid rgba(255,255,255,.2); }
  .summary { font-size: 1.02rem; font-weight: 500; line-height: 1.35; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.2); }

  /* Por hora */
  .hours { display: flex; overflow-x: auto; scrollbar-width: none; padding-top: 14px; margin: 0 -4px; }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: 0 0 62px; text-align: center; }
  .hour small { display: block; font-size: .95rem; font-weight: 700; }
  .hour .ic { height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 6px 0 4px; }
  .hour b { font-size: 1.3rem; font-weight: 600; }
  .pop { font-size: .78rem; font-weight: 700; color: #6fd8ff; line-height: 1; margin-top: -4px; }

  /* Dias */
  .day { display: grid; grid-template-columns: minmax(54px,1fr) 52px 38px minmax(80px,1.4fr) 38px; align-items: center; gap: 8px; min-height: 66px; border-top: 1px solid rgba(255,255,255,.2); }
  .day:first-of-type { border-top: 0; }
  .day .name { font-size: 1.35rem; font-weight: 500; }
  .day .ic { display: flex; flex-direction: column; align-items: center; }
  .day .mn { text-align: right; font-size: 1.35rem; font-weight: 500; opacity: .6; }
  .day .mx { text-align: right; font-size: 1.35rem; font-weight: 500; }
  .track { height: 5px; border-radius: 3px; background: rgba(0,0,0,.25); position: relative; }
  .track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .track u { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; border: 2px solid rgba(40,50,90,.7); }

  /* Detalhes */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid .card { margin: 0; min-height: 150px; display: flex; flex-direction: column; }
  .grid .card h2 { border: 0; padding-bottom: 0; }
  .grid .val { font-size: 2.2rem; font-weight: 500; margin-top: 6px; }
  .grid .sub { margin-top: auto; font-size: .9rem; font-weight: 500; line-height: 1.25; }
  .meta { text-align: center; opacity: .7; font-size: .8rem; line-height: 1.6; }
  .meta b { font-weight: 700; }

  /* Barra inferior */
  .dock { position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 520px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
  .circle, .pill { background: var(--dock); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.1); color: #fff; }
  .circle { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  .pill { height: 54px; padding: 0 26px; border-radius: 999px; display: flex; align-items: center; gap: 18px; }
  .pill button { background: none; border: 0; color: inherit; cursor: pointer; display: grid; place-items: center; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .circle:active, .pill button:active { transform: scale(.94); }
  .circle:focus-visible, .pill button:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* Permissão / erro */
  .status { text-align: center; padding: 22vh 12px 0; }
  .status h1 { font-size: 2rem; font-weight: 600; line-height: 1.1; }
  .status p { margin-top: 12px; font-size: 1.05rem; line-height: 1.45; opacity: .85; }
  .btn { margin-top: 26px; font: inherit; font-weight: 600; color: #fff; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.3); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 14px 30px; border-radius: 999px; cursor: pointer; }
  [hidden] { display: none !important; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } body { transition: none; } }
</style>
</head>
<body class="clouds-night">
<main>
  <section class="status" id="status">
    <h1 id="statusTitle">Clima onde você está</h1>
    <p id="statusText">Permita o acesso à sua localização para ver o tempo em tempo real.</p>
    <button class="btn" id="allow" type="button">Permitir localização</button>
  </section>

  <div id="weather" hidden>
    <section class="top">
      <div class="loc"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 11 21 3l-8 18-2-8z"/></svg>MINHA LOCALIZAÇÃO</div>
      <div class="city" id="city"></div>
      <div class="now"><span class="t" id="temp"></span><span class="bar-sep">|</span><span class="c" id="desc"></span></div>
    </section>

    <section class="card">
      <div class="summary" id="summary"></div>
      <div class="hours" id="hours"></div>
    </section>

    <section class="card">
      <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="daysTitle">PREVISÃO PARA OS PRÓXIMOS DIAS</span></h2>
      <div id="days"></div>
    </section>

    <div class="grid">
      <section class="card"><h2>SENSAÇÃO TÉRMICA</h2><div class="val" id="feels"></div><div class="sub" id="feelsSub"></div></section>
      <section class="card"><h2>UMIDADE</h2><div class="val" id="humidity"></div><div class="sub" id="humSub"></div></section>
      <section class="card"><h2>VENTO</h2><div class="val" id="wind"></div><div class="sub" id="windSub"></div></section>
      <section class="card"><h2>PRESSÃO</h2><div class="val" id="pressure"></div><div class="sub">hPa</div></section>
      <section class="card"><h2>VISIBILIDADE</h2><div class="val" id="visibility"></div><div class="sub" id="visSub"></div></section>
      <section class="card"><h2>NASCER DO SOL</h2><div class="val" id="sunrise"></div><div class="sub" id="sunsetSub"></div></section>
    </div>
    <div class="meta" id="updated"></div>
  </div>
  <div class="meta">Feito por <b>Arthur Dev Web</b> · Dados: Open-Meteo</div>
</main>

<nav class="dock" id="dock" hidden>
  <a class="circle" id="mapBtn" target="_blank" rel="noopener" aria-label="Abrir mapa"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></a>
  <div class="pill">
    <button id="locBtn" type="button" aria-label="Atualizar localização"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M3 11 21 3l-8 18-2-8z"/></svg></button>
    <i></i><i></i><i></i>
  </div>
  <button class="circle" id="topBtn" type="button" aria-label="Voltar ao topo"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><circle cx="4.5" cy="6" r="1.6"/><circle cx="4.5" cy="12" r="1.6"/><circle cx="4.5" cy="18" r="1.6"/><rect x="8" y="5" width="14" height="2.4" rx="1.2"/><rect x="8" y="10.8" width="14" height="2.4" rx="1.2"/><rect x="8" y="16.8" width="14" height="2.4" rx="1.2"/></svg></button>
</nav>

<script>
  // Open-Meteo: gratuita e sem chave de API
  const URL_FORE = "https://api.open-meteo.com/v1/forecast";
  const URL_GEO = "https://api.bigdatacloud.net/data/reverse-geocode-client"; // só para descobrir o nome da cidade
  const REFRESH_MS = 10 * 60 * 1000, MIN_MOVE_KM = 1;

  const $ = (id) => document.getElementById(id);
  let watchId = null, last = { lat: null, lon: null, time: 0 }, uid = 0;

  function showStatus(title, text, label) {
    $("weather").hidden = true; $("dock").hidden = true; $("status").hidden = false;
    $("statusTitle").textContent = title; $("statusText").textContent = text;
    const b = $("allow"); b.hidden = !label; if (label) b.textContent = label;
  }
  function distKm(a, b, c, d) {
    const R = 6371, r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  const local = (u, tz) => new Date((u + tz) * 1000);
  const hh = (u, tz) => String(local(u, tz).getUTCHours()).padStart(2, "0");
  const hhmm = (u, tz) => hh(u, tz) + ":" + String(local(u, tz).getUTCMinutes()).padStart(2, "0");
  const WEEK = ["Dom.", "Seg.", "Ter.", "Qua.", "Qui.", "Sex.", "Sáb."];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------- Ícones em SVG (estilo SF Symbols) ---------- */
  const cloud = (f = "#fff") => `<circle cx="20" cy="32" r="10" fill="${f}"/><circle cx="33" cy="24" r="13" fill="${f}"/><circle cx="46" cy="32" r="10" fill="${f}"/><rect x="20" y="32" width="26" height="10" fill="${f}"/>`;
  const moon = (cx, cy, r) => { const m = "m" + (++uid); return `<mask id="${m}"><rect width="64" height="60" fill="#fff"/><circle cx="${cx + r * .55}" cy="${cy - r * .4}" r="${r * .85}" fill="#000"/></mask><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" mask="url(#${m})"/>`; };
  const sun = (cx, cy, r, rays) => { let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffd23f"/>`; if (rays) for (let a = 0; a < 8; a++) { const t = a * Math.PI / 4, c = Math.cos(t), n = Math.sin(t); s += `<line x1="${cx + c * (r + 4)}" y1="${cy + n * (r + 4)}" x2="${cx + c * (r + 9)}" y2="${cy + n * (r + 9)}" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>`; } return s; };
  const drops = `<g stroke="#6fd8ff" stroke-width="3" stroke-linecap="round"><line x1="25" y1="46" x2="22" y2="54"/><line x1="35" y1="46" x2="32" y2="54"/><line x1="45" y1="46" x2="42" y2="54"/></g>`;

  function icon(id, night, size = 40) {
    let g;
    if (id >= 200 && id < 300) g = cloud("#c3c9dc") + `<polygon points="35,40 26,51 32,51 28,59 40,46 34,46" fill="#ffd23f"/>`;
    else if (id >= 300 && id < 600) g = cloud("#dbe3ee") + drops;
    else if (id >= 600 && id < 700) g = cloud("#dbe3ee") + `<circle cx="24" cy="50" r="2.4" fill="#fff"/><circle cx="34" cy="53" r="2.4" fill="#fff"/><circle cx="44" cy="50" r="2.4" fill="#fff"/>`;
    else if (id >= 700 && id < 800) g = cloud("#cfd6df") + `<g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="14" y1="48" x2="50" y2="48"/><line x1="20" y1="54" x2="44" y2="54"/></g>`;
    else if (id === 800) g = night ? moon(32, 30, 15) : sun(32, 30, 11, true);
    else if (id === 801 || id === 802) g = (night ? moon(45, 19, 11) : sun(45, 19, 9, false)) + `<g transform="translate(-5 8)">${cloud()}</g>`;
    else g = `<g transform="translate(0 4)">${cloud()}</g>`;
    return `<svg viewBox="0 0 64 60" width="${size}" height="${size}" aria-hidden="true">${g}</svg>`;
  }
  function skyClass(id, night) {
    if (id >= 200 && id < 300) return "storm";
    if (id >= 300 && id < 600) return night ? "rain-night" : "rain-day";
    if (id >= 600 && id < 700) return "snow";
    if (id >= 700 && id < 800) return "mist";
    if (id === 800) return night ? "clear-night" : "clear-day";
    return night ? "clouds-night" : "clouds-day";
  }
  const stops = [[8, [111, 216, 255]], [16, [215, 216, 78]], [24, [245, 197, 66]], [30, [247, 144, 43]], [36, [240, 87, 42]]];
  function tempColor(t) {
    if (t <= stops[0][0]) return `rgb(${stops[0][1]})`;
    for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], k = (t - t0) / (t1 - t0);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k))})`;
    }
    return `rgb(${stops[stops.length - 1][1]})`;
  }
  const compass = (deg) => ["N", "NE", "L", "SE", "S", "SO", "O", "NO"][Math.round(deg / 45) % 8];

  /* ---------- Dados (Open-Meteo) ---------- */
  // converte o código WMO da Open-Meteo para o id usado pelos ícones
  const WMO = (c) => c === 0 ? 800 : c === 1 ? 801 : c === 2 ? 802 : c === 3 ? 804 : (c === 45 || c === 48) ? 741 : c <= 57 ? 300 : c <= 67 ? 500 : c <= 77 ? 600 : c <= 82 ? 520 : c <= 86 ? 620 : 200;
  const DESC = {0:"Céu limpo",1:"Pouco nublado",2:"Parcialmente nublado",3:"Nublado",45:"Neblina",48:"Neblina",51:"Garoa fraca",53:"Garoa",55:"Garoa forte",56:"Garoa congelante",57:"Garoa congelante",61:"Chuva fraca",63:"Chuva",65:"Chuva forte",66:"Chuva congelante",67:"Chuva congelante",71:"Neve fraca",73:"Neve",75:"Neve forte",77:"Grãos de neve",80:"Pancadas de chuva",81:"Pancadas de chuva",82:"Pancadas fortes",85:"Pancadas de neve",86:"Pancadas de neve",95:"Tempestade",96:"Tempestade com granizo",99:"Tempestade com granizo"};

  async function load(lat, lon) {
    try {
      const q = `latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,weather_code,precipitation_probability,is_day,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=10&wind_speed_unit=kmh`;
      const [w, g] = await Promise.all([
        fetch(`${URL_FORE}?${q}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch(`${URL_GEO}?latitude=${lat}&longitude=${lon}&localityLanguage=pt`).then((r) => r.ok ? r.json() : null).catch(() => null)
      ]);
      render(w, g, lat, lon);
      last = { lat, lon, time: Date.now() };
    } catch (e) {
      showStatus("Não foi possível carregar o clima", "Confira sua conexão e tente novamente.", "Tentar de novo");
    }
  }

  function render(w, g, lat, lon) {
    const c = w.current, H = w.hourly, D = w.daily;
    const night = !c.is_day, code = c.weather_code, id = WMO(code), cur = c.temperature_2m;
    document.body.className = skyClass(id, night);
    document.querySelector('meta[name="theme-color"]').content = night ? "#2a3d6b" : "#2d7fd8";

    $("city").textContent = (g && (g.city || g.locality)) || "Minha localização";
    $("temp").textContent = Math.round(cur) + "°";
    $("desc").textContent = DESC[code] || "";

    // posição da hora atual na lista por hora
    const key = c.time.slice(0, 13);
    let i = H.time.findIndex((t) => t.slice(0, 13) === key); if (i < 0) i = 0;

    // Resumo
    let maxp = 0, at = -1;
    for (let k = i + 1; k <= i + 12 && k < H.time.length; k++) { const p = H.precipitation_probability[k] || 0; if (p > maxp) { maxp = p; at = k; } }
    let txt = (DESC[code] || "Tempo") + " agora.";
    if (maxp >= 50) txt += ` Chance de chuva de ${maxp}% por volta das ${H.time[at].slice(11, 13)}h.`;
    txt += ` As rajadas de vento estão a ${Math.round(c.wind_gusts_10m)} km/h.`;
    $("summary").textContent = txt;

    // Por hora (próximas 24 horas)
    let hours = `<div class="hour"><small>Agora</small><div class="ic">${icon(id, night)}</div><b>${Math.round(cur)}°</b></div>`;
    for (let k = i + 1; k <= i + 24 && k < H.time.length; k++) {
      const p = H.precipitation_probability[k] || 0;
      hours += `<div class="hour"><small>${H.time[k].slice(11, 13)}</small><div class="ic">${icon(WMO(H.weather_code[k]), !H.is_day[k])}${p >= 20 ? `<span class="pop">${p}%</span>` : ""}</div><b>${Math.round(H.temperature_2m[k])}°</b></div>`;
    }
    $("hours").innerHTML = hours;

    // 10 dias
    const lo = Math.min(...D.temperature_2m_min), hi = Math.max(...D.temperature_2m_max), span = Math.max(hi - lo, 1);
    $("daysTitle").textContent = `PREVISÃO PARA ${D.time.length} DIAS`;
    $("days").innerHTML = D.time.map((t, k) => {
      const mn = D.temperature_2m_min[k], mx = D.temperature_2m_max[k], p = D.precipitation_probability_max[k] || 0;
      const l = ((mn - lo) / span) * 100, wd = Math.max(((mx - mn) / span) * 100, 8);
      const dot = k === 0 ? `<u style="left:${Math.min(Math.max(((cur - lo) / span) * 100, 0), 100)}%"></u>` : "";
      return `<div class="day"><span class="name">${k === 0 ? "Hoje" : WEEK[new Date(t + "T12:00:00Z").getUTCDay()]}</span>
        <span class="ic">${icon(WMO(D.weather_code[k]), false, 34)}${p >= 20 ? `<span class="pop">${p}%</span>` : ""}</span>
        <span class="mn">${Math.round(mn)}°</span>
        <div class="track"><i style="left:${l}%;width:${wd}%;background:linear-gradient(90deg,${tempColor(mn)},${tempColor(mx)})"></i>${dot}</div>
        <span class="mx">${Math.round(mx)}°</span></div>`;
    }).join("");

    // Detalhes
    $("feels").textContent = Math.round(c.apparent_temperature) + "°";
    const diff = Math.round(c.apparent_temperature - cur);
    $("feelsSub").textContent = diff === 0 ? "Parecida com a temperatura real." : diff > 0 ? "Parece mais quente que a temperatura real." : "Parece mais frio que a temperatura real.";
    $("humidity").textContent = c.relative_humidity_2m + "%";
    $("humSub").textContent = c.relative_humidity_2m >= 80 ? "Ar bem úmido." : c.relative_humidity_2m <= 30 ? "Ar seco." : "Nível confortável.";
    $("wind").textContent = Math.round(c.wind_speed_10m);
    $("windSub").textContent = "km/h · direção " + compass(c.wind_direction_10m);
    $("pressure").textContent = Math.round(c.pressure_msl);
    const vis = H.visibility && H.visibility[i];
    $("visibility").textContent = vis != null ? Math.min(vis / 1000, 99).toFixed(0) : "—";
    $("visSub").textContent = "km · nuvens: " + c.cloud_cover + "%";
    $("sunrise").textContent = D.sunrise[0].slice(11, 16);
    $("sunsetSub").textContent = "Pôr do sol: " + D.sunset[0].slice(11, 16);
    $("updated").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    $("mapBtn").href = `https://www.google.com/maps/@${lat},${lon},12z`;

    $("status").hidden = true; $("weather").hidden = false; $("dock").hidden = false;
    document.title = `${Math.round(cur)}° ${$("city").textContent} | Arthur Dev Web`;
  }

  /* ---------- Localização em tempo real ---------- */
  function onPosition(p) {
    const { latitude: lat, longitude: lon } = p.coords;
    if (last.lat === null || distKm(last.lat, last.lon, lat, lon) > MIN_MOVE_KM || Date.now() - last.time > REFRESH_MS) load(lat, lon);
  }
  function onError(e) {
    if (e.code === 1) showStatus("Localização bloqueada", "Ative a permissão de localização para este site nas configurações do navegador e tente de novo.", "Tentar de novo");
    else if (e.code === 2) showStatus("Não encontramos sua posição", "Verifique se o GPS ou a internet estão ligados.", "Tentar de novo");
    else showStatus("A localização demorou demais", "Tente de novo em um lugar com melhor sinal.", "Tentar de novo");
  }
  function start() {
    if (!("geolocation" in navigator)) return showStatus("Navegador sem suporte", "Este navegador não permite acessar a localização.", null);
    if (window.isSecureContext === false) return showStatus("Conexão não segura", "A localização só funciona em páginas HTTPS.", null);
    showStatus("Buscando sua localização…", "Aceite o pedido de permissão do navegador.", null);
    $("statusTitle").classList.add("pulse");
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(
      (p) => { $("statusTitle").classList.remove("pulse"); onPosition(p); },
      (e) => { $("statusTitle").classList.remove("pulse"); onError(e); },
      { enableHighAccuracy: false, maximumAge: 60000, timeout: 15000 }
    );
  }

  $("allow").addEventListener("click", start);
  $("locBtn").addEventListener("click", () => { if (last.lat !== null) load(last.lat, last.lon); else start(); });
  $("topBtn").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  setInterval(() => { if (last.lat !== null) load(last.lat, last.lon); }, REFRESH_MS);
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: "geolocation" }).then((r) => { if (r.state === "granted") start(); }).catch(() => {});
  }
</script>
</body>
</html>
